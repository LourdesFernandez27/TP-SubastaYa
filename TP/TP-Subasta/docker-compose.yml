services:
    mysql:
        image: mysql:latest
        container_name: MySQL
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: admin123
            MYSQL_DATABASE: baseDatos
            MYSQL_USER: user
            MYSQL_PASSWORD: user123
        ports:
            - "3306:3306"
        volumes:
            - ./datosDB:/var/lib/mysql    